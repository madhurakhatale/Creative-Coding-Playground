<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Waves</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #090909;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .header {
            position: fixed;
            top: 28px;
            left: 35px;
            z-index: 10;
        }

        .header .number {
            font-size: 11px;
            letter-spacing: 3px;
            color: #9b8cff;
            margin-bottom: 8px;
        }

        .back {
            position: fixed;
            top: 30px;
            right: 35px;
            z-index: 10;

            color: #9a9a9a;
            text-decoration: none;
            font-size: 12px;

            border: 1px solid #292929;
            padding: 9px 14px;

            transition: 0.3s ease;
        }

        .back:hover {
            color: #f5f5f5;
            border-color: #9b8cff;
        }

        .info {
            position: fixed;
            bottom: 30px;
            left: 35px;
            z-index: 10;
        }

        .info h2 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 7px;
        }

        .info p {
            font-size: 12px;
            color: #777;
            letter-spacing: 0.3px;
        }

        @media (max-width: 600px) {
            .header {
                left: 20px;
                top: 20px;
            }

            .back {
                right: 20px;
                top: 20px;
            }

            .info {
                left: 20px;
                bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <canvas id="waveCanvas"></canvas>

    <div class="header">
        <div class="number">CREATIVE CODING / 06</div>
    </div>

    <a href="index.html" class="back">← Back</a>

    <div class="info">
        <h2>Interactive Waves</h2>
        <p>Layered waves responding smoothly to the movement of the cursor.</p>
    </div>

    <script>
        const canvas = document.getElementById("waveCanvas");
        const ctx = canvas.getContext("2d");

        let width;
        let height;

        let time = 0;

        const mouse = {
            x: -1000,
            y: -1000
        };

        const smoothMouse = {
            x: -1000,
            y: -1000
        };

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener("resize", resizeCanvas);

        window.addEventListener("mousemove", (event) => {
            mouse.x = event.clientX;
            mouse.y = event.clientY;
        });

        window.addEventListener("mouseleave", () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        function updateMouse() {
            smoothMouse.x +=
                (mouse.x - smoothMouse.x) * 0.08;

            smoothMouse.y +=
                (mouse.y - smoothMouse.y) * 0.08;
        }

        function drawWave(offset, amplitude, frequency, speed, opacity) {
            ctx.beginPath();

            for (let x = 0; x <= width; x += 4) {

                const baseY =
                    height * 0.5 + offset;

                const wave =
                    Math.sin(
                        x * frequency +
                        time * speed
                    ) * amplitude;

                const secondWave =
                    Math.sin(
                        x * frequency * 0.45 +
                        time * speed * 0.65
                    ) * amplitude * 0.35;

                let y =
                    baseY +
                    wave +
                    secondWave;

                const distance =
                    Math.sqrt(
                        Math.pow(x - smoothMouse.x, 2) +
                        Math.pow(baseY - smoothMouse.y, 2)
                    );

                if (distance < 260) {

                    const influence =
                        1 - distance / 260;

                    y +=
                        Math.sin(
                            x * 0.025 -
                            time * 2
                        ) *
                        influence *
                        35;
                }

                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.strokeStyle =
                `rgba(155, 140, 255, ${opacity})`;

            ctx.lineWidth = 1.2;
            ctx.lineCap = "round";
            ctx.stroke();
        }

        function drawSecondaryWave() {
            ctx.beginPath();

            for (let x = 0; x <= width; x += 5) {

                const centerY =
                    height * 0.5;

                const wave =
                    Math.sin(
                        x * 0.012 +
                        time * 1.15
                    ) * 80;

                const wave2 =
                    Math.sin(
                        x * 0.028 -
                        time * 0.7
                    ) * 25;

                let y =
                    centerY +
                    wave +
                    wave2;

                const distance =
                    Math.abs(x - smoothMouse.x);

                if (distance < 220) {

                    const influence =
                        1 - distance / 220;

                    y +=
                        Math.sin(
                            x * 0.035 +
                            time * 2
                        ) *
                        influence *
                        50;
                }

                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.strokeStyle =
                "rgba(110, 168, 255, 0.16)";

            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function drawGlow() {

            if (mouse.x < 0) {
                return;
            }

            const gradient =
                ctx.createRadialGradient(
                    smoothMouse.x,
                    smoothMouse.y,
                    0,
                    smoothMouse.x,
                    smoothMouse.y,
                    140
                );

            gradient.addColorStop(
                0,
                "rgba(155, 140, 255, 0.08)"
            );

            gradient.addColorStop(
                0.45,
                "rgba(110, 168, 255, 0.035)"
            );

            gradient.addColorStop(
                1,
                "rgba(110, 168, 255, 0)"
            );

            ctx.fillStyle = gradient;

            ctx.beginPath();

            ctx.arc(
                smoothMouse.x,
                smoothMouse.y,
                140,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        function animate() {

            ctx.fillStyle =
                "rgba(9, 9, 9, 0.22)";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );

            updateMouse();

            time += 0.015;

            drawWave(
                -150,
                28,
                0.012,
                1.0,
                0.16
            );

            drawWave(
                -90,
                35,
                0.015,
                0.85,
                0.24
            );

            drawWave(
                -25,
                42,
                0.018,
                0.72,
                0.34
            );

            drawWave(
                45,
                32,
                0.014,
                0.95,
                0.25
            );

            drawWave(
                110,
                26,
                0.011,
                1.1,
                0.16
            );

            drawSecondaryWave();

            drawGlow();

            requestAnimationFrame(animate);
        }

        resizeCanvas();

        smoothMouse.x = width / 2;
        smoothMouse.y = height / 2;

        requestAnimationFrame(animate);
    </script>

</body>
</html>
